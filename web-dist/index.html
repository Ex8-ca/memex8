<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>memex8 — Memory Browser</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #333;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 span {
            color: var(--accent);
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            max-width: 500px;
            margin: 0 2rem;
        }

        .search-box input {
            flex: 1;
            padding: 0.5rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-box button {
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .search-box button:hover { background: var(--accent-hover); }

        .nav-tabs {
            display: flex;
            gap: 0.25rem;
        }

        .nav-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.875rem;
        }

        .nav-tab:hover { color: var(--text); background: var(--surface-hover); }
        .nav-tab.active { color: var(--accent); border-color: var(--accent); }

        /* Stats bar */
        .stats-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 2rem;
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stats-bar span { color: var(--text); font-weight: 600; }

        /* Main content */
        .main { padding: 1.5rem 2rem; }
        .view { display: none; }
        .view.active { display: block; }

        /* Card view */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            transition: border-color 0.2s;
        }

        .card:hover { border-color: var(--accent); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .card-heading {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .card-realm {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-radius: 99px;
            white-space: nowrap;
        }

        .card-content {
            font-size: 0.85rem;
            color: var(--text-muted);
            max-height: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.75rem;
            white-space: pre-wrap;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .card-actions {
            display: flex;
            align-items: center;
        }

        .card-meta {
            display: flex;
            gap: 1rem;
        }

        .upvote-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
        }

        .upvote-btn:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .upvote-btn.upvoted {
            border-color: var(--green);
            color: var(--green);
            background: rgba(34, 197, 94, 0.1);
        }

        .downvote-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 0.25rem;
        }

        .downvote-btn:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }

        .downvote-btn.downvoted {
            border-color: var(--red);
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }

        .delete-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .delete-btn:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }

        .importance-bar {
            width: 60px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .importance-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Graph view */
        #graph-container {
            width: 100%;
            height: calc(100vh - 120px);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        #graph-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graph-canvas:active { cursor: grabbing; }

        .graph-toolbar {
            position: absolute;
            top: 0.75rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: rgba(15, 15, 15, 0.9);
            padding: 0.35rem 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 10;
        }

        .graph-btn {
            padding: 0.3rem 0.65rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.15s;
        }

        .graph-btn:hover { color: var(--text); background: var(--surface-hover); }
        .graph-btn.active { color: var(--accent); background: rgba(99, 102, 241, 0.15); }
        .graph-sep { width: 1px; height: 16px; background: var(--border); margin: 0 0.2rem; }

        .graph-tooltip {
            position: absolute;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            color: var(--text);
            pointer-events: none;
            z-index: 20;
            display: none;
            max-width: 240px;
            line-height: 1.4;
        }

        .graph-tooltip strong { color: var(--accent); display: block; margin-bottom: 0.2rem; }
        .graph-tooltip small { color: var(--text-muted); }

        .graph-hint {
            position: absolute;
            bottom: 0.75rem;
            right: 1rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.5;
            z-index: 10;
        }

        .graph-legend {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: rgba(15, 15, 15, 0.9);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.75rem;
            z-index: 10;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Realms view */
        .realms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .realm-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .realm-card h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .realm-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .realm-count {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 99px;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        /* Memory detail modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .modal pre {
            background: var(--bg);
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .modal-close:hover { color: var(--text); }

        .modal-downvote-btn {
            padding: 0.4rem 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .modal-downvote-btn:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }

        .modal-delete-btn {
            padding: 0.4rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--red);
            border-radius: 6px;
            color: var(--red);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .modal-delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 1rem; }
            .search-box { margin: 0; max-width: none; }
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>🧠</span> memex8</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search memories..." />
            <button onclick="doSearch()">Search</button>
        </div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-view="cards">Cards</button>
            <button class="nav-tab" data-view="graph">Graph</button>
            <button class="nav-tab" data-view="realms">Realms</button>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar">
        Memories: <span id="stat-memories">—</span>
        Realms: <span id="stat-realms">—</span>
        Provider: <span id="stat-provider">—</span>
        Slumber: <span id="stat-slumber">—</span>
    </div>

    <div class="main">
        <!-- Cards View -->
        <div class="view active" id="view-cards">
            <div class="cards" id="cards-container">
                <div class="loading">Loading memories...</div>
            </div>
        </div>

        <!-- Graph View -->
        <div class="view" id="view-graph">
            <div id="graph-container" style="position: relative;">
                <canvas id="graph-canvas"></canvas>
                <div class="graph-toolbar" id="graph-toolbar">
                    <button class="graph-btn active" data-filter="all" onclick="setGraphFilter('all')">All</button>
                    <button class="graph-btn" data-filter="realms" onclick="setGraphFilter('realms')">Realms</button>
                    <span class="graph-sep"></span>
                    <button class="graph-btn" onclick="resetGraphView()" title="Reset view">⌖</button>
                    <button class="graph-btn" onclick="toggleGraphLabels()" id="graph-labels-btn" title="Toggle labels">Aa</button>
                </div>
                <div class="graph-legend" id="graph-legend"></div>
                <div class="graph-tooltip" id="graph-tooltip"></div>
                <div class="graph-hint" id="graph-hint">Scroll to zoom · Drag to pan · Click node to select</div>
            </div>
        </div>

        <!-- Realms View -->
        <div class="view" id="view-realms">
            <div class="realms-grid" id="realms-container">
                <div class="loading">Loading realms...</div>
            </div>
        </div>
    </div>

    <!-- Memory Detail Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 id="modal-title"></h2>
            <pre id="modal-content"></pre>
            <div id="modal-meta" style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);"></div>
            <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="modal-downvote-btn" id="modal-downvote-btn" style="display: none;">
                    ▼ Downvote
                </button>
                <button class="modal-delete-btn" id="modal-delete-btn" style="display: none;">
                    🗑 Delete this memory
                </button>
            </div>
        </div>
    </div>

    <script>
        // ─── Config ──────────────────────────────────────────────
        const BASE_URL = window.location.origin;
        const API_KEY=__MEMEX8_API_KEY__; // Injected by server from MEMEX8_API_KEY env var

        // ─── State ────────────────────────────────────────────────
        let allMemories = [];
        let allRealms = [];
        let voteEnabled = !!(API_KEY && API_KEY !== 'memex8-dev-key');
        let currentMemoryId = null;

        // ─── Navigation ──────────────────────────────────────────
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`view-${tab.dataset.view}`).classList.add('active');

                if (tab.dataset.view === 'graph') {
                    initGraph();
                }
            });
        });

        // ─── API Helpers ─────────────────────────────────────────
        async function api(path) {
            const headers = {};
            if (API_KEY) headers['Authorization'] = `Bearer ${API_KEY}`;
            const resp = await fetch(`${BASE_URL}/api/v1${path}`, { headers });
            if (!resp.ok) throw new Error(`API error: ${resp.status}`);
            return resp.json();
        }

        // ─── Load Data ───────────────────────────────────────────
        async function loadAll() {
            try {
                // Load stats
                stats = await api('/stats');
                document.getElementById('stat-memories').textContent = stats.total_memories || 0;
                document.getElementById('stat-realms').textContent = stats.total_realms || 0;
                document.getElementById('stat-provider').textContent = stats.embedding_provider || '—';
                document.getElementById('stat-slumber').textContent = stats.slumber_state || '—';

                // Load memories (recall top 100 by importance)
                const recallData = await api('/memories/recall?limit=100');
                allMemories = recallData.results || [];
                renderCards(allMemories);

                // Load realms
                allRealms = await api('/realms');
                renderRealms(allRealms);

                // Render graph if visible
                if (document.getElementById('view-graph').classList.contains('active')) {
                    initGraph();
                }
            } catch (e) {
                console.error('Failed to load data:', e);
                document.getElementById('cards-container').innerHTML =
                    `<div class="loading" style="color: var(--red);">Failed to connect to memex8 server.<br><small>${e.message}</small></div>`;
            }
        }

        // ─── Cards ───────────────────────────────────────────────
        function renderCards(memories) {
            const container = document.getElementById('cards-container');

            if (!memories || memories.length === 0) {
                container.innerHTML = '<div class="loading">No memories found.</div>';
                return;
            }

            container.innerHTML = memories.map(m => `
                <div class="card" onclick="showMemory('${m.id}')">
                    <div class="card-header">
                        <div class="card-heading">${escapeHtml(m.heading || m.content.substring(0, 60))}</div>
                        <div class="card-realm">${escapeHtml(m.realm_name || 'general')}</div>
                    </div>
                    <div class="card-content">${escapeHtml(m.content)}</div>
                    <div class="card-footer">
                        <div class="card-meta">
                            <span>↑ ${m.upvotes || 0}</span>
                            <span>score: ${(m.score || m.importance || 0).toFixed(2)}</span>
                            <div class="importance-bar">
                                <div class="importance-fill" style="width: ${(m.importance || 0) * 100}%"></div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="upvote-btn ${m.upvotes > 0 ? 'upvoted' : ''}"
                                    onclick="event.stopPropagation(); upvote('${m.id}', this)">
                                ▲ Upvote
                            </button>
                            <button class="downvote-btn ${m.downvotes > 0 ? 'downvoted' : ''}"
                                    onclick="event.stopPropagation(); downvote('${m.id}', this)">
                                ▼ Downvote
                            </button>
                            <button class="delete-btn"
                                    onclick="event.stopPropagation(); deleteMemory('${m.id}', this)">
                                🗑 Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ─── Upvote ──────────────────────────────────────────────
        async function upvote(id, btn) {
            try {
                await api(`/memories/${id}/upvote`);
                btn.classList.add('upvoted');
                btn.textContent = '▲ Upvoted';

                // Update local state
                const mem = allMemories.find(m => m.id === id);
                if (mem) {
                    mem.upvotes = (mem.upvotes || 0) + 1;
                    mem.downvotes = (mem.downvotes || 0);
                    mem.importance = Math.min((mem.importance || 0) + 0.1, 1.0);
                    // Reset downvote display if it was active
                    const downBtn = btn.parentElement?.querySelector('.downvote-btn');
                    if (downBtn) {
                        downBtn.classList.remove('downvoted');
                        downBtn.textContent = '▼ Downvote';
                    }
                }
            } catch (e) {
                console.error('Upvote failed:', e);
            }
        }

        // ─── Downvote ──────────────────────────────────────────────
        async function downvote(id, btn) {
            try {
                await api(`/memories/${id}/downvote`);
                btn.classList.add('downvoted');
                btn.textContent = '▼ Downvoted';

                // Update local state
                const mem = allMemories.find(m => m.id === id);
                if (mem) {
                    mem.downvotes = (mem.downvotes || 0) + 1;
                    mem.importance = Math.max((mem.importance || 0) - 0.1, 0.01);
                    // Reset upvote display if it was active
                    const upBtn = btn.parentElement?.querySelector('.upvote-btn');
                    if (upBtn) {
                        upBtn.classList.remove('upvoted');
                        upBtn.textContent = '▲ Upvote';
                    }
                }
            } catch (e) {
                console.error('Downvote failed:', e);
            }
        }

        // ─── Delete ──────────────────────────────────────────────
        async function deleteMemory(id, btn) {
            if (!confirm('Delete this memory? This cannot be undone.')) return;
            try {
                await api(`/memories/${id}`, { method: 'DELETE' });

                // Remove from local state and re-render
                allMemories = allMemories.filter(m => m.id !== id);
                renderCards(allMemories);

                // Close modal if open
                closeModal();
            } catch (e) {
                console.error('Delete failed:', e);
                alert('Failed to delete memory: ' + e.message);
            }
        }

        // ─── Search ──────────────────────────────────────────────
        async function doSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                renderCards(allMemories);
                return;
            }

            try {
                const results = await api('/memories/search', {
                    method: 'POST',
                    headers: API_KEY ? { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, limit: 50 })
                });

                // Switch to cards view
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.querySelector('[data-view="cards"]').classList.add('active');
                document.getElementById('view-cards').classList.add('active');

                renderCards(results.results || []);
            } catch (e) {
                console.error('Search failed:', e);
            }
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // ─── Memory Detail ───────────────────────────────────────
        function showMemory(id) {
            const mem = allMemories.find(m => m.id === id);
            if (!mem) return;

            document.getElementById('modal-title').textContent = mem.heading || 'Memory';
            document.getElementById('modal-content').textContent = mem.content;
            document.getElementById('modal-meta').innerHTML = `
                <strong>Realm:</strong> ${mem.realm_name || 'general'} ·
                <strong>Importance:</strong> ${(mem.importance || 0).toFixed(2)} ·
                <strong>Upvotes:</strong> ${mem.upvotes || 0} ·
                <strong>Ingested:</strong> ${mem.ingested_at || '—'}
            `;
            document.getElementById('modal-overlay').classList.add('active');

            // Wire up modal buttons
            const deleteBtn = document.getElementById('modal-delete-btn');
            deleteBtn.style.display = 'inline-flex';
            deleteBtn.onclick = () => deleteMemory(id, deleteBtn);

            const downBtn = document.getElementById('modal-downvote-btn');
            downBtn.style.display = 'inline-flex';
            downBtn.textContent = '▼ Downvote';
            downBtn.onclick = () => {
                downvote(id, downBtn);
                downBtn.textContent = '▼ Downvoted';
            };
        }

        function closeModal() {
            document.getElementById('modal-delete-btn').style.display = 'none';
            document.getElementById('modal-downvote-btn').style.display = 'none';
            document.getElementById('modal-overlay').classList.remove('active');
        }

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ─── Realms ──────────────────────────────────────────────
        function renderRealms(realms) {
            const container = document.getElementById('realms-container');

            if (!realms || realms.length === 0) {
                container.innerHTML = '<div class="loading">No realms found.</div>';
                return;
            }

            const colors = ['#6366f1', '#22c55e', '#eab308', '#ef4444', '#3b82f6', '#f97316', '#a855f7', '#06b6d4'];

            container.innerHTML = realms.map((r, i) => `
                <div class="realm-card" onclick="filterByRealm('${r.name || r.id}')">
                    <h3 style="border-left: 3px solid ${colors[i % colors.length]}; padding-left: 0.5rem;">
                        ${escapeHtml(r.name || 'Unnamed')}
                    </h3>
                    ${r.description ? `<p>${escapeHtml(r.description)}</p>` : ''}
                    <div class="realm-count">${r.memory_count || 0} memories</div>
                </div>
            `).join('');
        }

        function filterByRealm(realmName) {
            const filtered = allMemories.filter(m => m.realm_name === realmName);
            renderCards(filtered);

            // Switch to cards view
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelector('[data-view="cards"]').classList.add('active');
            document.getElementById('view-cards').classList.add('active');
        }

        // ─── Graph View (Obsidian-style force-directed) ─────────────
        // State
        let gNodes = [];           // { id, label, type: 'memory'|'realm', x, y, vx, vy, radius, color, data }
        let gEdges = [];           // { source, target, strength }
        let gTransform = { x: 0, y: 0, scale: 1 };
        let gDrag = null;          // currently dragged node
        let gDragOffset = { x: 0, y: 0 }; // offset from node center at drag start
        let gWasDragged = false;   // true if mouse moved while dragging (prevents click)
        let gHovered = null;
        let gSelected = null;
        let gPanning = false;
        let gPanStart = { x: 0, y: 0 };
        let gAnimFrame = null;
        let gShowLabels = true;
        let gFilter = 'all';
        let gDpr = window.devicePixelRatio || 1;

        const REALM_COLORS = ['#6366f1', '#22c55e', '#eab308', '#ef4444', '#3b82f6', '#f97316', '#a855f7', '#06b6d4'];

        function getRealmColor(realmId, realms) {
            const idx = realms.findIndex(r => r.id === realmId);
            return REALM_COLORS[(idx >= 0 ? idx : 0) % REALM_COLORS.length];
        }

        // Lighten a hex color by a percentage (0-100)
        function lightenColor(hex, amount) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.min(255, (num >> 16) + amount);
            const g = Math.min(255, ((num >> 8) & 0x00FF) + amount);
            const b = Math.min(255, (num & 0x0000FF) + amount);
            return `rgb(${r},${g},${b})`;
        }

        // Build graph data from memories + realms
        function buildGraphData(memories, realms) {
            const realmById = {};
            const realmByName = {};
            realms.forEach((r, i) => {
                realmById[r.id] = r;
                realmByName[r.name] = r;
            });

            gNodes = [];
            gEdges = [];

            // Realm nodes (bigger, center)
            realms.forEach((r, i) => {
                const color = REALM_COLORS[i % REALM_COLORS.length];
                gNodes.push({
                    id: r.id,
                    label: r.name || 'Unnamed',
                    type: 'realm',
                    x: (Math.random() - 0.5) * 400,
                    y: (Math.random() - 0.5) * 400,
                    vx: 0, vy: 0,
                    radius: 8 + Math.min((r.memory_count || 0) * 0.6, 14),
                    color,
                    data: r
                });
            });

            // Memory nodes (smaller, orbit their realm)
            memories.forEach((m) => {
                // Memories have realm_name (string like "realm-28da6a75"), realms have name
                const realmNode = gNodes.find(n => n.label === m.realm_name);
                const color = realmNode ? realmNode.color : '#555';

                const spread = realmNode ? 100 : 200;
                const angle = Math.random() * Math.PI * 2;
                const dist = 60 + Math.random() * spread;

                gNodes.push({
                    id: m.id,
                    label: (m.content || '').substring(0, 40).replace(/\n/g, ' '),
                    type: 'memory',
                    x: (realmNode ? realmNode.x : 0) + Math.cos(angle) * dist,
                    y: (realmNode ? realmNode.y : 0) + Math.sin(angle) * dist,
                    vx: 0, vy: 0,
                    radius: 3 + (m.importance || 0.5) * 4,
                    color,
                    data: m
                });

                // Connect memory to its realm
                if (realmNode) {
                    gEdges.push({ source: m.id, target: realmNode.id, strength: 1 });
                }
            });

            // Memory-to-memory edges (same realm, high importance)
            memories.forEach((m1, i) => {
                memories.slice(i + 1).forEach((m2) => {
                    if (m1.realm_name && m1.realm_name === m2.realm_name) {
                        const imp = Math.min((m1.importance || 0) + (m2.importance || 0), 1);
                        if (imp > 0.6) {
                            gEdges.push({ source: m1.id, target: m2.id, strength: imp });
                        }
                    }
                });
            });
        }

        // Physics: run N steps of force simulation (Obsidian-style gentle forces)
        function simulateGraph(steps = 80) {
            const nodes = gNodes;

            for (let s = 0; s < steps; s++) {
                const progress = s / steps;

                // Repulsion between all pairs (gentle, Obsidian-style)
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const a = nodes[i], b = nodes[j];
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const dist2 = dx * dx + dy * dy + 1;
                        const dist = Math.sqrt(dist2);
                        const minD = a.radius + b.radius + 30;
                        if (dist < minD * 3) {
                            const force = 500 / dist2;
                            const fx = dx / dist * force;
                            const fy = dy / dist * force;
                            a.vx -= fx; a.vy -= fy;
                            b.vx += fx; b.vy += fy;
                        }
                    }
                }

                // Attraction along edges (spring force)
                gEdges.forEach(e => {
                    const a = nodes.find(n => n.id === e.source);
                    const b = nodes.find(n => n.id === e.target);
                    if (!a || !b) return;
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) + 0.01;
                    const ideal = a.type === 'realm' || b.type === 'realm' ? 100 : 50;
                    const force = (dist - ideal) * 0.02 * (e.strength || 0.5);
                    const fx = dx / dist * force;
                    const fy = dy / dist * force;
                    a.vx += fx; a.vy += fy;
                    b.vx -= fx; b.vy -= fy;
                });

                // Gentle centering gravity (keeps graph centered)
                nodes.forEach(n => {
                    n.vx -= n.x * 0.001;
                    n.vy -= n.y * 0.001;
                });

                // Progressive damping - more damping as we settle
                const damp = 0.85 + progress * 0.12;
                nodes.forEach(n => {
                    // Don't damp dragged nodes
                    if (n !== gDrag) {
                        n.vx *= damp;
                        n.vy *= damp;
                        n.x += n.vx;
                        n.y += n.vy;
                    }
                });
            }
        }

        // Canvas coordinate transforms
        function screenToGraph(sx, sy) {
            return {
                x: (sx - gTransform.x) / gTransform.scale,
                y: (sy - gTransform.y) / gTransform.scale
            };
        }

        function graphToScreen(gx, gy) {
            return {
                x: gx * gTransform.scale + gTransform.x,
                y: gy * gTransform.scale + gTransform.y
            };
        }

        // Hit-test: find node under screen point
        function nodeAt(sx, sy) {
            const g = screenToGraph(sx, sy);
            // Reverse so top-rendered nodes are picked first
            for (let i = gNodes.length - 1; i >= 0; i--) {
                const n = gNodes[i];
                const dx = n.x - g.x, dy = n.y - g.y;
                if (dx * dx + dy * dy < n.radius * n.radius) return n;
            }
            return null;
        }

        // Draw the graph
        function drawGraph() {
            const canvas = document.getElementById('graph-canvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            const s = gTransform.scale;
            const tx = gTransform.x, ty = gTransform.y;

            ctx.clearRect(0, 0, W, H);

            // Background
            ctx.fillStyle = '#0f0f0f';
            ctx.fillRect(0, 0, W, H);

            // Subtle grid dots
            const gridSpacing = 40 * s;
            if (s > 0.3) {
                const offsetX = (tx % gridSpacing + gridSpacing) % gridSpacing;
                const offsetY = (ty % gridSpacing + gridSpacing) % gridSpacing;
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                for (let x = offsetX; x < W; x += gridSpacing) {
                    for (let y = offsetY; y < H; y += gridSpacing) {
                        ctx.beginPath();
                        ctx.arc(x, y, 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Transform helper
            const sx = (gx) => gx * s + tx;
            const sy = (gy) => gy * s + ty;

            // Draw edges - thin, subtle like Obsidian
            gEdges.forEach(e => {
                if (gFilter === 'realms') return;
                const a = gNodes.find(n => n.id === e.source);
                const b = gNodes.find(n => n.id === e.target);
                if (!a || !b) return;
                if (a.type === 'memory' && b.type === 'memory' && gFilter === 'all') {
                    if (a.data && a.data.hidden) return;
                    if (b.data && b.data.hidden) return;
                }

                const ax = sx(a.x), ay = sy(a.y);
                const bx = sx(b.x), by = sy(b.y);

                // Obsidian-style: very thin, subtle edges
                const isRealmEdge = a.type === 'realm' || b.type === 'realm';
                const alpha = isRealmEdge ? 0.12 : 0.06;
                const width = isRealmEdge ? 0.8 : 0.4;

                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(bx, by);
                ctx.strokeStyle = `rgba(160,160,160,${alpha})`;
                ctx.lineWidth = width;
                ctx.stroke();
            });

            // Draw nodes - soft, glowy like Obsidian
            gNodes.forEach(n => {
                if (n.type === 'realm' && gFilter === 'realms') {
                    // Only realms visible
                } else if (n.type === 'memory' && gFilter === 'realms') return;

                const ns = n.radius * s;
                const nxs = sx(n.x), nys = sy(n.y);
                const isHovered = n === gHovered;
                const isSelected = n === gSelected;

                // Outer glow for hovered/selected nodes (Obsidian-style halo)
                if (isHovered || isSelected) {
                    const glowRadius = ns * 3;
                    const gradient = ctx.createRadialGradient(nxs, nys, ns * 0.5, nxs, nys, glowRadius);
                    gradient.addColorStop(0, n.color + '33');
                    gradient.addColorStop(1, n.color + '00');
                    ctx.beginPath();
                    ctx.arc(nxs, nys, glowRadius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }

                // Node circle with subtle gradient (Obsidian-style soft nodes)
                const nodeGrad = ctx.createRadialGradient(nxs - ns * 0.3, nys - ns * 0.3, 0, nxs, nys, ns);
                const baseAlpha = n.type === 'realm' ? 0.95 : 0.8;
                nodeGrad.addColorStop(0, lightenColor(n.color, isHovered ? 40 : 15));
                nodeGrad.addColorStop(1, n.color);

                ctx.beginPath();
                ctx.arc(nxs, nys, ns, 0, Math.PI * 2);
                ctx.fillStyle = nodeGrad;
                ctx.globalAlpha = baseAlpha;
                ctx.fill();
                ctx.globalAlpha = 1;

                // Subtle border for realm nodes
                if (n.type === 'realm') {
                    ctx.strokeStyle = isSelected ? '#fff' : 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = isSelected ? 2 : 1;
                    ctx.stroke();
                }

                // Label - show on hover for memories, always for realms
                const showLabel = gShowLabels || n.type === 'realm' || isHovered || isSelected;
                if (showLabel) {
                    const labelSize = n.type === 'realm'
                        ? Math.max(11, 12 * s)
                        : Math.max(9, 10 * s);
                    ctx.font = `${n.type === 'realm' ? '600' : '400'} ${labelSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    const labelY = nys + ns + 4;

                    // Subtle text shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillText(n.label, nxs + 1, labelY + 1);

                    const textColor = isSelected ? '#fff'
                        : isHovered ? '#fff'
                        : n.type === 'realm' ? n.color : 'rgba(200,200,200,0.8)';
                    ctx.fillStyle = textColor;
                    ctx.fillText(n.label, nxs, labelY);
                }
            });
        }

        // Animate the graph to settle
        function settleGraph() {
            if (gAnimFrame) cancelAnimationFrame(gAnimFrame);

            function step() {
                simulateGraph(3);
                drawGraph();
                gAnimFrame = requestAnimationFrame(step);
            }
            step();
        }

        // Center + fit the graph
        function resetGraphView() {
            const canvas = document.getElementById('graph-canvas');
            if (!canvas || gNodes.length === 0) return;

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            gNodes.forEach(n => {
                minX = Math.min(minX, n.x - n.radius);
                maxX = Math.max(maxX, n.x + n.radius);
                minY = Math.min(minY, n.y - n.radius);
                maxY = Math.max(maxY, n.y + n.radius);
            });

            const W = canvas.width, H = canvas.height;
            const pad = 80;
            const scaleX = (W - pad * 2) / (maxX - minX + 1);
            const scaleY = (H - pad * 2) / (maxY - minY + 1);
            gTransform.scale = Math.min(scaleX, scaleY, 1.5);
            gTransform.x = (W - (maxX + minX) * gTransform.scale) / 2;
            gTransform.y = (H - (maxY + minY) * gTransform.scale) / 2;
            drawGraph();
        }

        function toggleGraphLabels() {
            gShowLabels = !gShowLabels;
            const btn = document.getElementById('graph-labels-btn');
            btn.classList.toggle('active', gShowLabels);
            drawGraph();
        }

        function setGraphFilter(f) {
            gFilter = f;
            document.querySelectorAll('.graph-btn[data-filter]').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === f);
            });
            drawGraph();
        }

        // Initialize the graph canvas
        function initGraph() {
            if (gAnimFrame) return; // already running

            const canvas = document.getElementById('graph-canvas');
            const container = document.getElementById('graph-container');

            // Size canvas to container
            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = container.clientWidth * dpr;
                canvas.height = container.clientHeight * dpr;
                canvas.style.width = container.clientWidth + 'px';
                canvas.style.height = container.clientHeight + 'px';
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                gDpr = dpr;
                if (gNodes.length > 0) drawGraph();
            }

            resize();
            new ResizeObserver(resize).observe(container);

            // Build + simulate (initial layout)
            buildGraphData(allMemories, allRealms);
            simulateGraph(200); // more initial steps for better layout
            resetGraphView();

            // Start continuous simulation (like Obsidian - never fully stops)
            settleGraph();

            // ─── Mouse interactions ────────────────────────────────

            canvas.addEventListener('mousedown', e => {
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const hit = nodeAt(sx, sy);
                if (hit) {
                    gDrag = hit;
                    gSelected = hit;
                    gDragOffset = { x: sx, y: sy };
                    canvas.style.cursor = 'grabbing';
                } else {
                    gPanning = true;
                    gPanStart = { x: e.clientX - gTransform.x, y: e.clientY - gTransform.y };
                    canvas.style.cursor = 'grabbing';
                }
                drawGraph();
            });

            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;

                if (gDrag) {
                    // Move the dragged node in graph coordinates
                    const pos = screenToGraph(sx, sy);
                    gDrag.x = pos.x;
                    gDrag.y = pos.y;
                    gDrag.vx = 0;
                    gDrag.vy = 0;
                    gWasDragged = true;
                    drawGraph();
                    return;
                }

                if (gPanning) {
                    gTransform.x = e.clientX - gPanStart.x;
                    gTransform.y = e.clientY - gPanStart.y;
                    drawGraph();
                    return;
                }

                // Hover detection
                const hit = nodeAt(sx, sy);
                if (hit !== gHovered) {
                    gHovered = hit;
                    canvas.style.cursor = hit ? 'pointer' : 'grab';
                    drawGraph();

                    // Tooltip
                    const tip = document.getElementById('graph-tooltip');
                    if (hit) {
                        const imp = hit.data ? (hit.data.importance || 0) : 0;
                        tip.innerHTML = `<strong>${escapeHtml(hit.label)}</strong>
                            <small>${hit.type === 'realm' ? 'Realm · ' + (hit.data.memory_count || 0) + ' memories' : 'Memory · importance ' + imp.toFixed(2)}</small>`;
                        tip.style.display = 'block';
                        tip.style.left = (e.clientX - rect.left + 12) + 'px';
                        tip.style.top = (e.clientY - rect.top - 10) + 'px';
                    } else {
                        tip.style.display = 'none';
                    }
                } else if (hit) {
                    const tip = document.getElementById('graph-tooltip');
                    tip.style.left = (e.clientX - rect.left + 12) + 'px';
                    tip.style.top = (e.clientY - rect.top - 10) + 'px';
                }
            });

            canvas.addEventListener('mouseup', () => {
                gDrag = null;
                gPanning = false;
                gWasDragged = false;
                canvas.style.cursor = 'grab';
            });

            canvas.addEventListener('mouseleave', () => {
                gHovered = null;
                gDrag = null;
                gPanning = false;
                gWasDragged = false;
                document.getElementById('graph-tooltip').style.display = 'none';
                drawGraph();
            });

            // Zoom with wheel
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.1, Math.min(5, gTransform.scale * zoomFactor));

                // Zoom toward cursor
                gTransform.x = mx - (mx - gTransform.x) * (newScale / gTransform.scale);
                gTransform.y = my - (my - gTransform.y) * (newScale / gTransform.scale);
                gTransform.scale = newScale;

                drawGraph();
            }, { passive: false });

            // Click to open memory
            canvas.addEventListener('click', e => {
                if (gWasDragged) { gWasDragged = false; return; } // Don't open if we were dragging
                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const hit = nodeAt(sx, sy);
                if (hit && hit.type === 'memory' && hit.data) {
                    openMemoryModal(hit.data);
                }
            });

            // Build legend
            buildLegend();
        }

        function buildLegend() {
            const legend = document.getElementById('graph-legend');
            if (!legend) return;
            legend.innerHTML = allRealms.map((r, i) => `
                <div class="legend-item">
                    <div class="legend-dot" style="background: ${REALM_COLORS[i % REALM_COLORS.length]}"></div>
                    <span>${escapeHtml(r.name || 'Unnamed')}</span>
                </div>
            `).join('');
        }

        function openMemoryModal(memoryData) {
            if (!memoryData) return;
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            const meta = document.getElementById('modal-meta');

            title.textContent = memoryData.realm_name || 'Memory';
            content.textContent = (memoryData.content || '').substring(0, 1000);

            const imp = memoryData.importance || 0;
            const realm = memoryData.realm_name || '—';
            const realmColor = memoryData.realm_id ? getRealmColor(memoryData.realm_id, allRealms) : '#888';
            meta.innerHTML = `importance: <strong style="color:${realmColor}">${imp.toFixed(3)}</strong> · realm: <strong style="color:${realmColor}">${escapeHtml(realm)}</strong>`;

            // Show upvote/downvote/delete buttons
            const upvoteBtn = document.getElementById('modal-upvote-btn');
            const downvoteBtn = document.getElementById('modal-downvote-btn');
            const deleteBtn = document.getElementById('modal-delete-btn');
            if (upvoteBtn) {
                upvoteBtn.style.display = 'inline-block';
                upvoteBtn.onclick = () => { upvote(memoryData.id, upvoteBtn); closeModal(); };
            }
            if (downvoteBtn) {
                downvoteBtn.style.display = 'inline-block';
                downvoteBtn.onclick = () => { downvote(memoryData.id, downvoteBtn); closeModal(); };
            }
            if (deleteBtn) {
                deleteBtn.style.display = 'inline-block';
                deleteBtn.onclick = () => { if (confirm('Delete this memory?')) { deleteMemory(memoryData.id); closeModal(); } };
            }

            document.getElementById('modal-overlay').classList.add('active');
            currentMemoryId = memoryData.id;
        }

        // ─── Utilities ───────────────────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─── Init ────────────────────────────────────────────────
        loadAll();
    </script>
</body>
</html>
