services:
  qdrant:
    image: qdrant/qdrant:latest
    # Port mapping removed — memex8 connects via Docker internal network (http://qdrant:6333)
    # Uncomment below if you need direct host access to Qdrant
    # ports:
    #   - "6333:6333"
    #   - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      # Qdrant container has no curl/wget — use /healthz endpoint via bash
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  memex8:
    build: .
    ports:
      - "8080:8080"    # REST API + Web UI
      - "8081:8081"    # MCP SSE endpoint
    volumes:
      - ./watch_dirs:/watch          # Mount directories to watch
      - memex8_data:/var/lib/memex8  # Internal state, cache
      - ${HOME}/.memex8:/root/.memex8  # Digest log — persisted to host ~/.memex8/
    env_file:
      - ${HOME}/.hermes/.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
      - QDRANT_URL=http://qdrant:6334
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - RUST_LOG=info
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Optional: local embeddings via Ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if you have NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - local-embeddings
    restart: unless-stopped

volumes:
  qdrant_data:
  memex8_data:
  ollama_data:
