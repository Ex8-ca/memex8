version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  memex8:
    build: .
    ports:
      - "8080:8080"    # REST API + Web UI
      - "8081:8081"    # MCP SSE endpoint
    volumes:
      - ./config.toml:/etc/memex8/config.toml:ro
      - ./watch_dirs:/watch          # Mount directories to watch
      - memex8_data:/var/lib/memex8  # Internal state, cache
    environment:
      - MEMEX8_API_KEY=${MEMEX8_API_KEY:-memex8-dev-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - RUST_LOG=info
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Optional: local embeddings via Ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if you have NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - local-embeddings
    restart: unless-stopped

volumes:
  qdrant_data:
  memex8_data:
  ollama_data:
