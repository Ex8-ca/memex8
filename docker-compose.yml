services:
  qdrant:
    image: qdrant/qdrant:latest
    # Port mapping removed — memex8 connects via Docker internal network (http://qdrant:6333)
    # Uncomment below if you need direct host access to Qdrant
    # ports:
    #   - "6333:6333"
    #   - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      # Qdrant container has no curl/wget — use /healthz endpoint via bash
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  memex8:
    build: .
    ports:
      - "8080:8080"    # REST API + Web UI
      - "8081:8081"    # MCP SSE endpoint
    volumes:
      - ./watch_dirs:/watch          # Mount directories to watch
      - memex8_data:/var/lib/memex8  # Internal state, cache
    environment:
      - MEMEX8_API_KEY=${MEMEX8_API_KEY:-memex8-dev-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - QDRANT_URL=http://qdrant:6334
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - RUST_LOG=info
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Local embeddings via Ollama (started by default — no OpenAI key needed)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if you have NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data:
  memex8_data:
  ollama_data:
