name: CI

on:
  push:
    branches: [main]
  # Also validate dependent PRs before their parent feature branch lands.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    services:
      consolidation-qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6336:6334
      evidence-restore-qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6337:6334
      evidence-qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6335:6334
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenBLAS for ndarray)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      # Clippy is informational only right now — the repo has 40+
      # style lints from a newer clippy version that pre-date this
      # CI. Tracking issue: GitHub Actions run on Rust 1.94, the
      # local toolchain is older. When the lint backlog is cleared,
      # flip this back to: cargo clippy --all-targets -- -D warnings
      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --all-targets --message-format=short 2>&1 | tee /tmp/clippy.log | tail -50

      - name: Build
        run: cargo build --release

      # The k-means fixture was rewritten to use angular clusters, and the
      # centroid recompute bug that made the old test fail is fixed. Keep this
      # test in the gate: it was previously skipped on a misdiagnosis.
      - name: Run tests
        run: cargo test --

      - name: Test lifecycle recovery with disposable Qdrant
        env:
          MEMEX8_TEST_BINARY: ${{ github.workspace }}/target/release/memex8
        run: |
          docker pull qdrant/qdrant:v1.17.0
          python3 tests/test_dedup_inspection.py
          python3 tests/test_certification.py
          python3 tests/test_consolidation.py
          python3 tests/test_dedup_removal.py
          python3 tests/test_compact_retrieval.py
          python3 tests/test_search_coverage.py
          python3 tests/test_private_redaction.py
          python3 tests/test_timeline.py
          # Derived-index freshness: an index must never outlive the corpus
          # it describes, and ingest/undo must not be hidden by a loaded one.
          python3 tests/test_index_freshness.py
          python3 tests/test_index_coherence.py
          # Ingestion must report partial/failed honestly on REST, CLI and MCP.
          python3 tests/test_ingest_outcomes.py
          # Root webhook aliases stay authenticated; MCP SSE handshake completes.
          python3 tests/test_http_lifecycle.py
          # These exercise the real memex8 binary; the plugin-only matrix has
          # no Rust build, so running them there fails (or silently skips).
          python3 tests/test_dreams.py

      - name: Test real webhook checkpoint round trip
        env:
          MEMEX8_TEST_BINARY: ${{ github.workspace }}/target/release/memex8
        run: |
          python3 -m pip install pytest requests
          python3 -m pytest tests/test_plugin_webhook_roundtrip.py -q

      - name: Test source-preserving consolidation against disposable Qdrant
        env:
          MEMEX8_TEST_QDRANT_URL: http://127.0.0.1:6336
        run: cargo test --lib consolidation_tests -- --ignored --test-threads=1

      # Slumber pause/resume, interrupted-consolidation resume, graph pruning and
      # the certification/archive race depend on debug-only failpoints
      # (MEMEX8_TEST_*), so this step deliberately runs the DEBUG binary even
      # though the artifact above is release.
      - name: Test slumber controls, consolidation resume and certified archives
        env:
          MEMEX8_TEST_BINARY: ${{ github.workspace }}/target/debug/memex8
        run: |
          cargo build
          python3 tests/test_audit_control.py

      - name: Test explicit REST evidence against disposable Qdrant
        env:
          EVIDENCE_QDRANT_URL: http://127.0.0.1:6335
          EVIDENCE_RESTORE_QDRANT_URL: http://127.0.0.1:6337
        run: cargo test --test evidence_api -- --ignored

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: memex8-linux
          path: target/release/memex8
          retention-days: 7

  plugin-py:
    name: Plugin Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install plugin runtime deps
        run: pip install requests pyyaml pytest

      - name: AST parse check
        run: python3 -c "import ast; ast.parse(open('plugins/memex8/__init__.py').read()); print('parse OK on Python ${{ matrix.python-version }}')"

      - name: Compile with warnings as errors (3.12 only)
        if: matrix.python-version == '3.12'
        run: python3 -W error -c "import py_compile; py_compile.compile('plugins/memex8/__init__.py', doraise=True); print('compile OK on 3.12')"

      - name: Run plugin path-confinement tests
        run: python3 tests/test_export_import_path.py

      - name: Test shared memory bridge and Docker backup workflow
        run: |
          python3 integrations/shared-memory/test_bridge.py -v
          python3 tests/test_docker_backup.py -v
          python3 plugins/memex8/tests/test_visibility.py
          python3 plugins/memex8/tests/test_certification.py
          python3 plugins/memex8/tests/test_consolidation.py
          python3 plugins/memex8/tests/test_dedup_removal.py
          python3 plugins/memex8/tests/test_compact_retrieval.py
          python3 plugins/memex8/tests/test_search_coverage.py
          python3 plugins/memex8/tests/test_timeline.py

      # These files existed but were named in no CI step, so they could rot
      # silently (dreams and cron-filter findings were both in that state).
      - name: Test dreams and cron findings
        run: |
          python3 tests/test_cron_filter.py
          python3 plugins/memex8/tests/test_dreams.py
          python3 plugins/memex8/tests/test_cron_findings.py

      - name: Test query-aware prefetch isolation and deadlines
        run: python3 -m pytest tests/test_prefetch.py -q

      # Checkpoint archive unit tests are Python-only. The real webhook
      # round trip requires the Rust binary and runs in the Rust job above.
      - name: Test checkpoint durability and private-span redaction
        run: python3 -m pytest tests/test_plugin_checkpoint_privacy.py -q

      - name: Validate plugin.yaml
        run: |
          python3 -c "
          import yaml
          with open('plugins/memex8/plugin.yaml') as f:
              d = yaml.safe_load(f)
          assert d['name'] == 'memex8'
          assert isinstance(d['version'], str) and d['version']
          assert 'MEMEX8_API_KEY' in d.get('requires_env', [])
          print('plugin.yaml OK — version:', d['version'])
          "