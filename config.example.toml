[server]
host = "0.0.0.0"
port = 8080
mcp_port = 8081

[auth]
api_key_env = "MEMEX8_API_KEY"

[embedding]
provider = "ollama"            # "ollama" | "openai"
model = "nomic-embed-text"
dimensions = 768

[embedding.ollama]
url = "http://ollama:11434"
max_concurrent = 8

[embedding.openai]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"  # OpenAI-compatible: MiniMax, Together, Groq, etc.
model = "text-embedding-3-small"
dimensions = 1536

[qdrant]
url = "http://qdrant:6333"
collection_memories = "memories"
collection_quantized = "quantized"
collection_realms = "realms"
collection_graph_edges = "graph_edges"

[ingest]
default_chunk_by = "section"   # "section" | "paragraph" | "file"
max_chunk_tokens = 2000
poll_interval = "5m"

[realms]
auto_discover = true
similarity_threshold = 0.75
split_threshold = 100
merge_threshold = 0.3

[slumber]
idle_timeout = "10m"
cron_ingest = "*/5 * * * *"
quantize_bit_width = 3.5
auto_archive_days = 90
prune_threshold = 0.1
consolidation_schedule = "0 3 * * *"   # Daily at 3am; "" to disable

# Memory evolution: decay, associations, spreading activation
decay_rate_per_day = 0.001
association_top_k = 5
association_min_strength = 0.6
spreading_activation_bump = 0.005

# Slumber consolidation (Phase 6)
# backend: "openai" (uses OPENAI_API_KEY) or "local" (uses LOCAL_LLM_URL + LOCAL_LLM_API_KEY)
# Embedding provider is configured separately: [embedding].provider = "openai" | "ollama"
[slumber.consolidation]
backend = "openai"
model = "gpt-4o-mini"    # OpenAI model name

[slumber.summarize]
enabled = true
max_cluster_size = 20
preserve_originals = true
confidence_threshold = 0.8

[quantizer]
policy = "dynamic"          # "dynamic" (default) or "static"
static_bit_width = 3.5      # Used only when policy = "static"

[slumber.index_optimization]
enabled = true
deleted_threshold = 0.1
vacuum_min_vector_number = 1000
default_segment_number = 4
max_segment_size = 200000
memmap_threshold = 50000
indexing_threshold = 20000
flush_interval_sec = 5
max_optimization_threads = 2

[memex8_md]
enabled = true
max_memories = 20
update_on_slumber = true

[digest_md]
enabled = true
path = "~/.memex8/memex8.md"
max_memories = 20
include_realms = true
max_log_entries = 30

[web]
enabled = true
theme = "dark"

# [[watch]] — Persistent file watchers (added via `memex8 watch add /path`)
# Uncomment and customize, or use the CLI to add watches dynamically.
#
# [[watch]]
# path = "/home/user/projects"
# chunk_by = "section"       # "section" | "paragraph" | "file"
# poll_interval = "5m"
# realm_hint = "projects"     # Optional: hint for realm assignment
#
# [[watch]]
# path = "/home/user/notes"
# chunk_by = "file"
# poll_interval = "10m"
